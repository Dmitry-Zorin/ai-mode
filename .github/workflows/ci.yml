name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS-only app: it uses macOS-only Tauri APIs (overlay title bar,
    # HudWindow vibrancy, RunEvent::Reopen), so clippy must build on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./packages/desktop/src-tauri -> target"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Icons are gitignored; generate them so `generate_context!` can embed
      # them when clippy builds the crate.
      - name: Generate app icons
        run: bun run gen:icons

      - name: Biome check
        run: bunx biome ci .

      - name: Rust format check
        run: cargo fmt --manifest-path packages/desktop/src-tauri/Cargo.toml --check

      - name: Rust clippy
        run: cargo clippy --manifest-path packages/desktop/src-tauri/Cargo.toml -- -D warnings
