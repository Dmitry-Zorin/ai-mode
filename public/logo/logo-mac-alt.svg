    <clipPath id="squircle"><use href="#sq" /></clipPath>

    <!-- card depth: lighter at the top, deep charcoal at the floor -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a41" />
      <stop offset="0.55" stop-color="#242428" />
      <stop offset="1" stop-color="#161619" />
    </linearGradient>
    <!-- soft top-down light bloom for a glassy native sheen -->
    <radialGradient id="topGlow" cx="0.5" cy="0.0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- subtle seated shadow at the bottom edge -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0" />
      <stop offset="0.78" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.28" />
    </linearGradient>
    <!-- faint drop shadow so tiles read as raised cards -->
    <filter id="tileShadow" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- card body -->
  <use href="#sq" fill="url(#cardBg)" />

  <!-- depth overlays + tiles, clipped to the squircle -->
  <g clip-path="url(#squircle)">
    <rect x="-6" y="-6" width="81" height="81" fill="url(#topGlow)" />

    <!-- Оригинальная композиция уменьшена на 20% от центра: все плитки целиком внутри
         скруглённого квадрата, ни одна не обрезается кривой -->
    <g transform="translate(29.1716,28.7424) scale(0.8) translate(-29.1599,-28.6307)" filter="url(#tileShadow)">
      <rect x="2.7054281" y="2.0857034" width="14.370315" height="30.047024" rx="2.1555471" fill="#faf9f5" opacity="0.88" />
      <rect x="2.7054281" y="35.398701" width="14.370315" height="19.595884" rx="2.1555471" fill="#faf9f5" opacity="0.4" />
      <rect x="21.974733" y="2.0856938" width="14.370315" height="16.329903" rx="2.1555471" fill="#faf9f5" opacity="0.55" />
