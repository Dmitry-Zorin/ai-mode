      <rect x="21.974733" y="43.890251" width="14.370315" height="11.104335" rx="2.1555471" fill="#faf9f5" opacity="0.46" />
      <rect x="41.244011" y="2.0857034" width="14.370315" height="24.821453" rx="2.1555471" fill="#f4606c" />
      <rect x="41.244011" y="30.354132" width="14.370315" height="24.821453" rx="2.1555471" fill="#faf9f5" opacity="0.7" />
    </g>

    <rect x="-6" y="-6" width="81" height="81" fill="url(#floor)" />
  </g>

  <!-- inner top highlight rim crisps the squircle edge against the dock -->
  <use href="#sq" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.4" />
</svg>
